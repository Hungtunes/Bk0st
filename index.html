<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Công cụ tổng hợp & Biên tập Exam</title>
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        --primary-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        --bg-body: #f3f4f6;       
        --bg-panel-left: #ffffff; 
        --bg-panel-right: #f8fafc;
        --text-main: #1e293b;
        --text-secondary: #64748b;
        --border-subtle: #e2e8f0;
        --radius-lg: 16px;
        --radius-md: 10px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-main);
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    .left, .right {
        width: 50%;
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 20px;
        position: relative;
    }

    .left { background-color: var(--bg-panel-left); border-right: 1px solid var(--border-subtle); z-index: 2; }
    .right { background-color: var(--bg-panel-right); }

    textarea, select, #output {
        width: 100%;
        padding: 20px;
        font-size: 14px;
        font-family: 'JetBrains Mono', 'Consolas', monospace;
        line-height: 1.6;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        background-color: #fff;
        color: var(--text-main);
        transition: var(--transition);
        outline: none;
        resize: none;
        box-sizing: border-box;
    }

    textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
    textarea { flex-grow: 1; }
    #output { background-color: #fff; overflow-y: auto; flex-grow: 1; white-space: pre-wrap; }

    .guide-box {
        background-color: #e0e7ff; color: #3730a3; padding: 14px 18px;
        border-radius: var(--radius-md); font-size: 13px; line-height: 1.5;
        border-left: 4px solid #6366f1; display: none; 
    }

    .btn-group { display: flex; gap: 10px; }
    
    button {
        padding: 12px 24px; font-weight: 600; color: white;
        background: var(--primary-gradient); border: none;
        border-radius: 50px; cursor: pointer; box-shadow: var(--primary-shadow);
        transition: var(--transition); font-size: 13px; text-transform: uppercase;
    }

    button:hover { transform: translateY(-2px); filter: brightness(1.1); }
    
    .btn-send { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease; }
</style>
</head>
<body>

<div class="left">
    <h2 style="margin: 0;">Chọn chức năng</h2>
    <select id="functionSelect" onchange="updateGuide()">
        <option value="" disabled selected>-- Vui lòng chọn một công cụ --</option>
        <option value="edit_exam">Sửa bài thi (cURL to Tag)</option>
        <option value="id_to_qid">List ID thành [QID:ID]</option>
        <option value="qid_to_id">[QID:ID] thành List ID</option>
        <option value="wordCount">Đếm số câu trả lời</option>
        <option value="sort">Lọc đề cuối kỳ</option>
        <option value="qV">Tách câu hỏi</option>
        <option value="md">Phân loại mức độ</option>
    </select>

    <div id="guideBox" class="guide-box"></div>

    <h3 style="margin: 0;">Input</h3>
    <textarea id="input" placeholder="Chọn chức năng để xem hướng dẫn..."></textarea>

    <div class="btn-group">
        <button onclick="runFunction()">RUN (Parse)</button>
    </div>
</div>

<div class="right">
    <h2 style="margin: 0;">Output / Control</h2>

    <div class="btn-group">
        <button onclick="copyOutput()">COPY OUTPUT</button>
        <button id="btnSendApi" class="btn-send" style="display: none;" onclick="sendExamUpdate()">🚀 GỬI API LÊN SERVER</button>
    </div>

    <div id="output"></div>
</div>

<script>
// Biến toàn cục lưu cấu trúc API
let globalContext = { url: "", token: "", exam_id: null, templates: {} };

const guides = {
    "edit_exam": {
        text: "<b>Hướng dẫn:</b> 1. Dán cURL từ trình duyệt -> Bấm RUN để chuyển sang dạng thẻ tag. 2. Sửa nội dung/ID trực tiếp trong ô Input. 3. Bấm GỬI API ở bên phải để cập nhật.",
        placeholder: "Dán lệnh cURL (Windows hoặc Bash) vào đây..."
    },
    "id_to_qid": { text: "<b>Hướng dẫn:</b> Nhập danh sách ID số.", placeholder: "12345\n67890" },
    "qid_to_id": { text: "<b>Hướng dẫn:</b> Trích xuất số từ [QID:ID].", placeholder: "[QID:12345]" },
    "wordCount": { text: "<b>Hướng dẫn:</b> HTML ### List ID.", placeholder: "HTML code\n###\n123" },
    "sort": { text: "<b>Hướng dẫn:</b> Mã đề kết thúc bằng #.", placeholder: "ct-n1-20231-01\n#" },
    "qV": { text: "<b>Hướng dẫn:</b> Văn bản thô kết thúc bằng ***.", placeholder: "Bài 1...\n***" },
    "md": { text: "<b>Hướng dẫn:</b> ID Mức_độ # Filter # Chủ đề.", placeholder: "101 M1 Topic\n#" }
};

function updateGuide() {
    const func = document.getElementById("functionSelect").value;
    const guideBox = document.getElementById("guideBox");
    const inputBox = document.getElementById("input");
    const btnSend = document.getElementById("btnSendApi");

    btnSend.style.display = (func === "edit_exam") ? "block" : "none";

    if (guides[func]) {
        guideBox.innerHTML = guides[func].text;
        inputBox.placeholder = guides[func].placeholder;
        guideBox.style.display = "block";
        guideBox.classList.add("fade-in");
    }
}

// =========================
// LOGIC SỬA BÀI THI (EXAM EDITOR)
// =========================

function parseCurlToEditor(rawCurl) {
    const cleanCurl = rawCurl.replace(/\^\r?\n/g, '').replace(/\^/g, '');
    
    // Tách URL & Token
    const urlMatch = cleanCurl.match(/curl\s+["']?([^"'\s]+)/);
    const authMatch = cleanCurl.match(/authorization:\s*Bearer\s*([^"']+)/i);
    if (urlMatch) globalContext.url = urlMatch[1];
    if (authMatch) globalContext.token = authMatch[1].trim();

    // Tách JSON
    const dataMatch = cleanCurl.match(/--data-raw\s+"(.*)"/s) || cleanCurl.match(/-d\s+"(.*)"/s);
    if (!dataMatch) return "Lỗi: Không tìm thấy dữ liệu JSON trong cURL!";

    try {
        const jsonStr = dataMatch[1].replace(/\\"/g, '"');
        const data = JSON.parse(jsonStr);
        globalContext.exam_id = data.exam_id;
        
        let editorContent = `exam_id: ${data.exam_id}\n\n`;
        data.questions.forEach(part => {
            editorContent += `<part> ${part.partTitle}\n`;
            part.partData.forEach(q => {
                globalContext.templates[q.id] = q;
                editorContent += `[QID:${q.id}]\n`;
            });
            editorContent += `</part>\n\n`;
        });
        return editorContent;
    } catch (e) { return "Lỗi Parse JSON: " + e.message; }
}

async function sendExamUpdate() {
    const text = document.getElementById("input").value;
    const outputBox = document.getElementById("output");
    
    if (!globalContext.url) return alert("Vui lòng dán cURL và bấm RUN trước!");

    try {
        const examIdMatch = text.match(/exam_id:\s*(\d+)/);
        const exam_id = examIdMatch ? parseInt(examIdMatch[1]) : globalContext.exam_id;
        const questions = [];
        const partRegex = /<part>\s*(.*?)\n([\s\S]*?)<\/part>/g;
        let match;

        while ((match = partRegex.exec(text)) !== null) {
            const partTitle = match[1].trim();
            const partData = [];
            const qidRegex = /\[QID:(\d+)\]/g;
            let qMatch;
            while ((qMatch = qidRegex.exec(match[2])) !== null) {
                const id = parseInt(qMatch[1]);
                partData.push(globalContext.templates[id] || { id, type: 4, title: "", description: "<p></p>", answers: [], note: null, level: 1 });
            }
            questions.push({ partTitle, partData });
        }

        outputBox.textContent = "🚀 Đang gửi dữ liệu...";
        const response = await fetch(globalContext.url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${globalContext.token}` },
            body: JSON.stringify({ exam_id, questions })
        });

        const result = await response.json();
        outputBox.textContent = `TRẠNG THÁI: ${response.status}\n\n` + JSON.stringify(result, null, 4);
    } catch (err) { outputBox.textContent = "LỖI: " + err.message; }
}

// =========================
// CHƯƠNG TRÌNH CŨ & ĐIỀU HƯỚNG
// =========================

function runFunction() {
    const func = document.getElementById("functionSelect").value;
    const input = document.getElementById("input").value;
    let output = "";

    if (func === "edit_exam") {
        const result = parseCurlToEditor(input);
        document.getElementById("input").value = result; // Chuyển input thành editor
        output = "--- ĐÃ CHUYỂN SANG CHẾ ĐỘ BIÊN TẬP ---\nHãy sửa các [QID] trong ô Input bên trái, sau đó bấm nút GỬI API màu xanh.";
    } else {
        switch (func) {
            case "id_to_qid": output = program_id_to_qid(input); break;
            case "qid_to_id": output = program_qid_to_id(input); break;
            case "wordCount": output = program_wordCount(input); break;
            case "sort":      output = sort(input); break;
            case "qV":        output = strokeQuestionV(input); break;
            case "md":        output = PhanLoaiMucDo(input); break;
        }
    }
    document.getElementById("output").textContent = output;
}

// (Các hàm cũ giữ nguyên)
function program_id_to_qid(i) { return i.trim().split(/\s+/).filter(t => /^-?\d+$/.test(t)).map(n => `[QID:${n}]`).join("\n"); }
function program_qid_to_id(i) { return i.split(/\n/).map(l => l.replace(/[^0-9]/g, "")).filter(l => l).join("\n"); }
function program_wordCount(i) { 
    const p = i.split('###'); if(p.length<2) return "Thiếu ###";
    const dataMap = {}; const idR = /ID:\s*(\d+)/g; const cR = /Xem giải\s*\((\d+)\)/g;
    let m; while((m=idR.exec(p[0]))){ const c=cR.exec(p[0]); if(c) dataMap[m[1]]=c[1]; }
    return (p[1].match(/\d+/g)||[]).map(id => `${id} - ${dataMap[id]||0}`).join('\n');
}
function sort(i) {
    const mp = {"ct":"CTTT","n1":"NN1","n2":"NN2","n3":"NN3","ds":"Đại số","g1":"Giải tích 1"};
    return Array.from(new Set(i.trim().split(/\s+/))).filter(s=>s!=="#").sort().map(code => {
        const p = code.split('-'); if(p.length!==4) return "Lỗi: "+code;
        return `${mp[p[0]]||p[0]} - (${mp[p[1]]||p[1]}) - Đề ${parseInt(p[3])} - ${p[2].slice(0,-1)}.${p[2].slice(-1)}`;
    }).join('\n');
}
function strokeQuestionV(i) {
    let t="", n=1, res=[];
    for(let l of i.split('\n')){
        let s=l.trim(); if(s==="***") break; if(!s) continue;
        if(s.startsWith("Bài")){ t=s.split('.')[1]||""; continue; }
        res.push(`Câu ${n++}: ${t} ${s.includes(')')?s.split(')')[1]:s}`);
    }
    return res.join('\n');
}
function PhanLoaiMucDo(i) {
    const p = i.split('#'); const lines = p[0].trim().split('\n');
    const topicMap = new Map();
    lines.forEach(l => {
        const m = l.match(/^(\S+)\s+(\S+)\s+(.+)$/); if(!m) return;
        const [_, id, md, sub] = m;
        if(!topicMap.has(sub)) topicMap.set(sub, new Map());
        const lMap = topicMap.get(sub); if(!lMap.has(md)) lMap.set(md, []);
        lMap.get(md).push(id);
    });
    let out = "";
    topicMap.forEach((lm, top) => {
        out += `${top}\n`;
        Array.from(lm.keys()).sort().forEach(lv => {
            out += `<part> Mức độ ${lv.substring(1)}\n` + lm.get(lv).map(q => `[QID:${q}]`).join('\n') + `\n</part>\n`;
        });
    });
    return out;
}

function copyOutput() {
    navigator.clipboard.writeText(document.getElementById("output").textContent).then(() => alert("Đã copy!"));
}
window.onload = updateGuide;
</script>
</body>
</html>

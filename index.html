<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Công cụ tổng hợp các chương trình C++</title>
<style>
    :root {
        /* Bảng màu hiện đại (Violet/Indigo Gradient) */
        --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        --primary-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        
        /* Màu nền & text */
        --bg-body: #f3f4f6;       
        --bg-panel-left: #ffffff; 
        --bg-panel-right: #f8fafc;
        
        --text-main: #1e293b;
        --text-secondary: #64748b;
        --border-subtle: #e2e8f0;
        
        --radius-lg: 16px;
        --radius-md: 10px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Reset & Typography chuẩn */
    body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-main);
        display: flex;
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* --- TÙY CHỈNH THANH CUỘN (SCROLLBAR) --- */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }

    /* --- BỐ CỤC --- */
    .left, .right {
        width: 50%;
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 20px;
        position: relative;
    }

    .left {
        background-color: var(--bg-panel-left);
        border-right: 1px solid var(--border-subtle);
        z-index: 2;
    }

    .right {
        background-color: var(--bg-panel-right);
    }

    /* --- INPUT & OUTPUT --- */
    textarea, select, #output {
        width: 100%;
        padding: 20px;
        font-size: 15px;
        font-family: 'JetBrains Mono', 'Consolas', monospace;
        line-height: 1.6;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        background-color: #f1f5f9;
        color: var(--text-main);
        transition: var(--transition);
        outline: none;
        resize: none;
        box-sizing: border-box;
    }

    .left textarea, .left select {
        background-color: #fff;
        border: 1px solid var(--border-subtle);
        box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    textarea:focus, select:focus {
        background-color: #fff;
        border-color: #6366f1;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        transform: translateY(-2px);
    }

    textarea {
        flex-grow: 1;
        min-height: 250px;
    }

    #output {
        background-color: #fff;
        border: 1px solid var(--border-subtle);
        color: #334155;
        overflow-y: auto;
        cursor: text;
        flex-grow: 1;
    }

    /* --- KHUNG HƯỚNG DẪN (GUIDE BOX) --- */
    .guide-box {
        background-color: #e0e7ff; 
        color: #3730a3; 
        padding: 14px 18px;
        border-radius: var(--radius-md);
        font-size: 13.5px;
        line-height: 1.6;
        border-left: 4px solid #6366f1;
        transition: var(--transition);
        display: none; 
    }

    .fade-in {
        animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* --- NÚT BẤM (BUTTON) --- */
    button {
        padding: 14px 32px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: white;
        background: var(--primary-gradient);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: var(--primary-shadow);
        transition: var(--transition);
        align-self: flex-start;
        text-transform: uppercase;
        font-size: 14px;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        filter: brightness(1.1);
    }

    button:active {
        transform: translateY(1px);
        box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
        body {
            flex-direction: column;
            height: auto;
            overflow-y: auto;
        }
        .left, .right {
            width: 100%;
            padding: 20px;
            height: auto;
            border-right: none;
            border-bottom: 1px solid var(--border-subtle);
        }
        textarea, #output {
            min-height: 200px;
        }
    }
</style>
</head>
<body>

<div class="left">
    <h2 style="margin: 0;">Chọn chức năng</h2>
    <select id="functionSelect" onchange="updateGuide()">
        <option value="" disabled selected>-- Vui lòng chọn một công cụ --</option>
        <option value="id_to_qid">List ID thành [QID:ID]</option>
        <option value="qid_to_id">[QID:ID] thành List ID</option>
        <option value="wordCount">Đếm số câu trả lời</option>
        <option value="sort">Lọc đề cuối kỳ</option>
        <option value="qV">Tách câu hỏi</option>
        <option value="md">Phân loại mức độ</option>
    </select>

    <div id="guideBox" class="guide-box"></div>

    <h3 style="margin: 0;">Input</h3>
    <textarea id="input" placeholder="Vui lòng chọn chức năng ở trên để xem hướng dẫn nhập liệu..."></textarea>

    <button onclick="runFunction()">RUN</button>
</div>

<div class="right">
    <h2 style="margin: 0;">Output</h2>

    <button onclick="copyOutput()" style="margin-bottom: 0;">COPY OUTPUT</button>

    <div id="output" style="white-space: pre-wrap;"></div>
</div>

<script>
// =========================
// DATA HƯỚNG DẪN SỬ DỤNG
// =========================
const guides = {
    "id_to_qid": {
        text: "<b>Hướng dẫn:</b> Nhập một danh sách các số ID (cách nhau bởi khoảng trắng hoặc xuống dòng). Các ký tự không phải số nguyên sẽ bị bỏ qua.",
        placeholder: "Ví dụ:\n12345\n67890\nabc (sẽ bị bỏ qua)"
    },
    "qid_to_id": {
        text: "<b>Hướng dẫn:</b> Nhập đoạn văn bản chứa các tag <code>[QID:ID]</code>. Công cụ sẽ trích xuất và trả về danh sách chỉ gồm các con số ID.",
        placeholder: "Ví dụ:\n[QID:10293]\nCâu hỏi này có mã [QID:48291]"
    },
    "wordCount": {
        text: "<b>Hướng dẫn:</b> Nhập mã HTML chứa dữ liệu, sau đó gõ <code>###</code>, và cuối cùng dán danh sách ID cần kiểm tra (mỗi ID 1 dòng).",
        placeholder: "Ví dụ:\n<div id=\"ID: 123\">... Xem giải (5)</div>\n###\n123\n456"
    },
    "sort": {
        text: "<b>Hướng dẫn:</b> Nhập mã đề (ví dụ: <code>ct-n1-20231-01</code>). Các mã cách nhau bởi khoảng trắng/xuống dòng. Kết thúc danh sách bằng ký tự <code>#</code>.",
        placeholder: "Ví dụ:\nct-n1-20231-01\nds-g1-20222-05\n#"
    },
    "qV": {
        text: "<b>Hướng dẫn:</b> Nhập văn bản thô. Tự động nhận diện 'Bài' hoặc các mục a), b) để tách thành định dạng 'Câu 1:', 'Câu 2:'. Gõ <code>***</code> ở cuối để dừng thuật toán.",
        placeholder: "Ví dụ:\nBài 1. Giới thiệu...\na) Câu hỏi phụ 1\nb) Câu hỏi phụ 2\n***"
    },
    "md": {
        text: "<b>Hướng dẫn:</b> Nhập danh sách <code>ID Mức_độ</code> (VD: <i>123 M1</i>). Nếu muốn lọc, gõ <code>#</code> rồi dán danh sách ID cần giữ lại ở bên dưới.",
        placeholder: "Ví dụ:\n101 M1\n102 M2\n103 M1\n#\n101\n103"
    }
};

function updateGuide() {
    const func = document.getElementById("functionSelect").value;
    const guideBox = document.getElementById("guideBox");
    const inputBox = document.getElementById("input");

    if (guides[func]) {
        guideBox.innerHTML = guides[func].text;
        inputBox.placeholder = guides[func].placeholder;
        guideBox.style.display = "block";
        
        guideBox.classList.remove("fade-in");
        void guideBox.offsetWidth; // Trigger reflow
        guideBox.classList.add("fade-in");
    } else {
        guideBox.style.display = "none";
        inputBox.placeholder = "Vui lòng chọn chức năng ở trên để xem hướng dẫn nhập liệu...";
    }
}

// =========================
// TẬP HỢP CÁC CHƯƠNG TRÌNH
// =========================

function PhanLoaiMucDo(inputText) {
    const parts = inputText.split('#');
    const upperPart = parts[0].trim();   
    
    let filterPart = null;
    let mainTopic = "";

    // Xác định Filter và Chủ đề chính dựa trên số lượng dấu #
    if (parts.length === 3) {
        // Trường hợp có cả Filter và Chủ đề chính: Data # Filter # Chủ đề
        filterPart = parts[1].trim();
        mainTopic = parts[2].trim();
    } else if (parts.length === 2) {
        // Trường hợp chỉ có 1 dấu #: Data # (Filter hoặc Chủ đề)
        const part1 = parts[1].trim();
        // Nếu phần này có nhiều dòng hoặc chỉ chứa toàn số, khả năng cao nó là Filter
        if (part1.split(/\r?\n/).length > 1 || /^\d+$/.test(part1)) {
            filterPart = part1;
        } else {
            // Nếu là một dòng chữ thông thường, nó là Chủ đề chính
            mainTopic = part1;
        }
    }

    let filterSet = null;
    if (filterPart) {
        filterSet = new Set(
            filterPart.split(/\r?\n/).map(x => x.trim()).filter(x => x.length > 0)
        );
    }

    const lines = upperPart.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
    const topicMap = new Map();

    lines.forEach(line => {
        const match = line.match(/^(\S+)\s+(\S+)\s+(.+)$/);
        if (!match) return;

        const qid = match[1];
        const mucDo = match[2];
        const subTopic = match[3].trim();

        // Ghép Chủ đề chính (nếu có) vào trước Chủ đề con
        const topic = mainTopic ? `${mainTopic}: ${subTopic}` : subTopic;

        if (filterSet && !filterSet.has(qid)) return;

        if (!topicMap.has(topic)) {
            topicMap.set(topic, new Map());
        }

        const levelMap = topicMap.get(topic);
        
        if (!levelMap.has(mucDo)) {
            levelMap.set(mucDo, []);
        }
        
        levelMap.get(mucDo).push(qid);
    });

    let output = "";

    topicMap.forEach((levelMap, topic) => {
        output += `${topic}\n`;

        const sortedLevels = Array.from(levelMap.keys()).sort((a, b) => {
            return parseInt(a.substring(1)) - parseInt(b.substring(1));
        });

        sortedLevels.forEach(level => {
            const levelNumber = level.substring(1);
            output += `<part> Mức độ ${levelNumber}\n`;
            levelMap.get(level).forEach(qid => {
                output += `[QID:${qid}]\n`;
            });
            output += `</part>\n\n`;
        });
    });

    return output.trim();
}

function program_id_to_qid(inputText) {
    const tokens = inputText.trim().split(/\s+/);
    const numbers = tokens.filter(t => /^-?\d+$/.test(t));
    return numbers.map(num => `[QID:${num}]`).join("\n");
}

function program_qid_to_id(inputText) {
    const lines = inputText.split(/\r?\n/);
    let result = [];
    for (let line of lines) {
        if (line.trim() === "") continue;
        let digits = "";
        for (let c of line) {
            if (/[0-9]/.test(c)) digits += c;
        }
        result.push(digits);
    }
    return result.join("\n");
}

function program_wordCount(inputText) {
    const parts = inputText.split('###');
    if (parts.length < 2) {
        return "Lỗi: Không tìm thấy dấu ngăn cách '###' giữa HTML và danh sách ID.";
    }

    const htmlContent = parts[0];
    const idListString = parts[1];
    const dataMap = {};
    const idRegex = /ID:\s*(\d+)/g;
    const countRegex = /Xem giải\s*\((\d+)\)/g;

    let idMatch;
    while ((idMatch = idRegex.exec(htmlContent)) !== null) {
        const id = parseInt(idMatch[1]);
        countRegex.lastIndex = idRegex.lastIndex;
        const countMatch = countRegex.exec(htmlContent);

        if (countMatch) {
            dataMap[id] = parseInt(countMatch[1]);
            idRegex.lastIndex = countRegex.lastIndex;
        } else {
            break; 
        }
    }

    const queryIds = idListString.match(/\d+/g); 
    if (!queryIds || queryIds.length === 0) {
        return "Không có ID nào được nhập để kiểm tra.";
    }

    let resultLog = "";
    let notSolvedCount = 0;
    const totalQueries = queryIds.length;

    queryIds.forEach(idStr => {
        const id = parseInt(idStr);
        const count = dataMap[id] || 0; 
        if (count === 0) notSolvedCount++;
        resultLog += `${id} - ${count}\n`;
    });

    const solvedCount = totalQueries - notSolvedCount;
    resultLog += `Đã giải: ${solvedCount}\n`;
    resultLog += `Chưa giải: ${notSolvedCount}`;

    return resultLog;
}

function sort(inputText) {
    const mp = {
        "ct": "CTTT",
        "n1": "NN1",
        "n2": "NN2",
        "n3": "NN3",
        "ds": "Đại số",
        "g1": "Giải tích 1"
    };

    const tokens = inputText.trim().split(/\s+/);
    const uniqueData = new Set();

    for (let s of tokens) {
        if (s === "#") break; 
        uniqueData.add(s);
    }

    const sortedData = Array.from(uniqueData).sort();

    const parse = (code) => {
        const parts = code.split('-');
        if (parts.length !== 4) return "Mã không hợp lệ: " + code;

        const ct = mp[parts[0]] || parts[0];
        const mon = mp[parts[1]] || parts[1];
        const yearRaw = parts[2];
        const year = yearRaw.slice(0, -1) + "." + yearRaw.slice(-1);
        const deNum = parseInt(parts[3], 10);
        const de = "Đề " + deNum;

        return `${ct} - (${mon}) - (Cuối kỳ) ${de} - ${year}`;
    };

    return sortedData.map(parse).join('\n');
}

function strokeQuestionV(inputText) {
    const lines = inputText.split('\n');
    let topic = "";
    let num = 1;
    const results = [];

    for (let rawLine of lines) {
        let line = rawLine.trimStart().replace(/\r$/, '');
        if (line === "***") break;
        if (line.length === 0) continue;

        if (line.startsWith("Bài") || line.startsWith("Exercise")) {
            const dotPos = line.indexOf('.');
            if (dotPos !== -1 && dotPos + 1 < line.length) {
                topic = line.substring(dotPos + 1).trimStart();
            } else {
                topic = "";
            }
            continue;
        }

        const p = line.indexOf(')');
        if (p !== -1 && p <= 3) {
            if (p + 1 < line.length) {
                line = line.substring(p + 1).trimStart();
            } else {
                line = "";
            }
        }

        let out = `Câu ${num}:`;
        if (topic) out += ` ${topic}`;
        if (line)  out += ` ${line}`;

        results.push(out);
        num++;
    }

    return results.join('\n');
}

// =========================
// CHẠY CHƯƠNG TRÌNH & COPY
// =========================
function runFunction() {
    const func = document.getElementById("functionSelect").value;
    const input = document.getElementById("input").value;
    let output = "";

    if (!func) {
        output = "Vui lòng chọn một chức năng trước khi RUN.";
    } else {
        switch (func) {
            case "id_to_qid":  output = program_id_to_qid(input); break;
            case "qid_to_id":  output = program_qid_to_id(input); break;
            case "wordCount":  output = program_wordCount(input); break;
            case "sort":       output = sort(input); break;
            case "qV":         output = strokeQuestionV(input); break;
            case "md":         output = PhanLoaiMucDo(input); break;
            default:           output = "Chức năng chưa được cài đặt.";
        }
    }

    document.getElementById("output").textContent = output;
}

function copyOutput() {
    const text = document.getElementById("output").textContent;
    if (!text) {
        alert("Chưa có kết quả để copy!");
        return;
    }
    navigator.clipboard.writeText(text).then(() => {
        alert("Đã copy vào clipboard!");
    }).catch(err => {
        alert("Lỗi khi copy: " + err);
    });
}

// Gọi hàm cập nhật hướng dẫn ban đầu
window.onload = updateGuide;
</script>

</body>
</html>
